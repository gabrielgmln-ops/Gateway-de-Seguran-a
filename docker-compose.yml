# Caminho: docker-compose.yml
#
# Somente o gateway publica uma porta para o host. Ledger, Pix, Antifraude,
# Redis e PostgreSQL ficam apenas na rede "interna", inalcançáveis de fora,
# de modo que todo acesso passa obrigatoriamente pelo gateway.
#
# Pré-requisito: ./scripts/gerar-env.sh (cria o .env com os segredos).

# Endurecimento comum (âncora YAML reaproveitada abaixo).
x-hardening: &hardening
  read_only: true                 # sistema de arquivos somente leitura
  cap_drop: [ALL]                 # remove todas as capabilities do Linux
  security_opt:
    - no-new-privileges:true      # impede escalada de privilégio (setuid etc.)
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build: .
    image: gateway-seguranca:local
    ports:
      # Porta do host configurável: no PC Windows do autor, 8080 a 8082 já estão
      # ocupadas (AgentService, Ledger API, Pix Simulado). Use GATEWAY_HOST_PORT=8083 no .env.
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    # Segredos (JWT_SECRET, OAUTH_CLIENTS...) vêm do .env, gerado por scripts/gerar-env.sh.
    env_file: .env
    # "environment" tem prioridade sobre o env_file: dentro do Compose, os
    # serviços são acessados pelo nome na rede interna, e não por localhost.
    environment:
      GATEWAY_ADDR: ":8080"
      # Padrão: os mocks da rede interna. Para usar os serviços REAIS rodando no
      # host, defina no .env, por exemplo, COMPOSE_LEDGER_URL=http://host.docker.internal:8081.
      # As credenciais de serviço (LEDGER_USUARIO/LEDGER_SENHA) vêm do env_file.
      LEDGER_URL: "${COMPOSE_LEDGER_URL:-http://ledger:9000}"
      PIX_URL: "${COMPOSE_PIX_URL:-http://pix:9000}"
      ANTIFRAUDE_URL: "${COMPOSE_ANTIFRAUDE_URL:-http://antifraude:9000}"
      REDIS_ADDR: "redis:6379"
      # sslmode=disable só é aceitável porque o banco está numa rede interna isolada.
      # Em produção, use sslmode=verify-full com certificado.
      DATABASE_URL: "postgres://gateway:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/seguranca?sslmode=disable"
    # host.docker.internal já existe no Docker Desktop (Windows/macOS); esta linha
    # garante o mesmo nome no Docker Engine do Linux (ex.: CI).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [interna]
    depends_on:
      ledger: {condition: service_started}
      pix: {condition: service_started}
      antifraude: {condition: service_started}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  ledger:
    <<: *hardening
    image: gateway-seguranca:local
    entrypoint: ["/usr/local/bin/mockservice"]
    environment:
      SERVICE_NAME: ledger
    networks: [interna]

  pix:
    <<: *hardening
    image: gateway-seguranca:local
    entrypoint: ["/usr/local/bin/mockservice"]
    environment:
      SERVICE_NAME: pix
    networks: [interna]

  antifraude:
    <<: *hardening
    image: gateway-seguranca:local
    entrypoint: ["/usr/local/bin/mockservice"]
    environment:
      SERVICE_NAME: antifraude
    networks: [interna]

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    user: redis                   # roda sem root
    # A senha vem do .env (interpolação "${...}" do Compose). "$$" escapa o "$"
    # para que a variável seja expandida pelo shell do contêiner, e não pelo Compose.
    # --save '' e --appendonly no: os baldes são dados efêmeros, sem gravação em disco.
    entrypoint: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

  postgres:
    image: postgres:16-alpine
    # O entrypoint oficial precisa de root na inicialização (ajusta permissões e depois
    # troca para o usuário postgres), por isso aqui não se usa read_only nem cap_drop.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      POSTGRES_DB: seguranca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d seguranca"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

networks:
  interna:
    driver: bridge

volumes:
  pgdata:
