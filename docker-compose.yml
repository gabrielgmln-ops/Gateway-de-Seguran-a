# Caminho: docker-compose.yml
#
# Somente o gateway publica uma porta para o host. Os serviços internos ficam
# apenas na rede "interna", inalcançáveis de fora, de modo que todo acesso passa
# obrigatoriamente pelo gateway.

# Endurecimento comum a todos os contêineres (âncora YAML reaproveitada abaixo).
x-hardening: &hardening
  read_only: true                 # sistema de arquivos somente leitura
  cap_drop: [ALL]                 # remove todas as capabilities do Linux
  security_opt:
    - no-new-privileges:true      # impede escalada de privilégio (setuid etc.)
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build: .
    image: gateway-seguranca:local
    ports:
      - "8080:8080"
    # Segredos (JWT_SECRET, OAUTH_CLIENTS...) vêm do .env, gerado por scripts/gerar-env.sh.
    env_file: .env
    # "environment" tem prioridade sobre o env_file: dentro do Compose, os
    # serviços são acessados pelo nome na rede interna, e não por localhost.
    environment:
      GATEWAY_ADDR: ":8080"
      LEDGER_URL: "http://ledger:9000"
      PIX_URL: "http://pix:9000"
      ANTIFRAUDE_URL: "http://antifraude:9000"
      REDIS_ADDR: "redis:6379"
    networks: [interna]
    depends_on:
      ledger: {condition: service_started}
      pix: {condition: service_started}
      antifraude: {condition: service_started}
      redis: {condition: service_healthy}

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    # A senha vem do .env (interpolação "${...}" do Compose). "$$" escapa o "$"
    # para que a variável seja expandida pelo shell do contêiner, e não pelo Compose.
    # --save '' e --appendonly no: os baldes são dados efêmeros, sem gravação em disco.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"
      REDISCLI_AUTH: "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

  ledger:
    <<: *hardening
    image: gateway-seguranca:local
    entrypoint: ["/usr/local/bin/mockservice"]
    environment:
      SERVICE_NAME: ledger
    networks: [interna]

  pix:
    <<: *hardening
    image: gateway-seguranca:local
    entrypoint: ["/usr/local/bin/mockservice"]
    environment:
      SERVICE_NAME: pix
    networks: [interna]

  antifraude:
    <<: *hardening
    image: gateway-seguranca:local
    entrypoint: ["/usr/local/bin/mockservice"]
    environment:
      SERVICE_NAME: antifraude
    networks: [interna]

networks:
  interna:
    driver: bridge
