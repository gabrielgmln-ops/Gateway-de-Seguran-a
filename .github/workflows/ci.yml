# Caminho: .github/workflows/ci.yml
#
# Pipeline de integração contínua: roda a cada push e pull request.
#   1. qualidade: formatação (gofmt), análise estática (go vet) e vulnerabilidades (govulncheck)
#   2. testes: suíte completa com detector de corrida, PostgreSQL real e cobertura mínima
#   3. docker: garante que a imagem de produção compila
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o token do GitHub só pode ler o repositório.
permissions:
  contents: read

# Cancela execuções antigas do mesmo branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_MIN: "80"
  # Versão usada no build e na análise estática (a mais recente suportada).
  GO_VERSION: "1.27.x"

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos sem gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: govulncheck (vulnerabilidades conhecidas nas dependências)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  testes:
    runs-on: ubuntu-latest
    # Testa nas duas versões do Go com suporte oficial.
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          # Senha SINTÉTICA de um banco efêmero que só existe durante o job de CI.
          POSTGRES_PASSWORD: ci-somente-teste
          POSTGRES_DB: seguranca_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway -d seguranca_teste"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gateway:ci-somente-teste@localhost:5432/seguranca_teste?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Testes com detector de corrida e cobertura
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./internal/...
      - name: Verificar cobertura mínima
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "Cobertura total: ${total}% (mínimo: ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t >= m) }' || { echo "Cobertura abaixo do mínimo"; exit 1; }
      - name: Relatório HTML de cobertura
        run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-go${{ matrix.go }}
          path: |
            coverage.out
            coverage.html

  docker:
    runs-on: ubuntu-latest
    needs: [qualidade, testes]
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t gateway-seguranca:ci .
